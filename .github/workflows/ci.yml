name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: sudo apt-get update && sudo apt-get install -y cargo rustc

      - name: Build (warnings are failures)
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo build --release

      - name: Full test suite
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test

      - name: Three-process failover demo
        run: bash scripts/cluster-demo.sh

      - name: Benchmark smoke test
        run: cargo run --release -- bench
